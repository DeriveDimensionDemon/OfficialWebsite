<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post — Derive Dimension Demon</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #171717;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}

body { min-height: 100vh; }

.site-header,
.post-page,
.site-footer {
    width: 630px;
    margin: 0 auto;
}

/* ===== Header placeholder =====
   Later this area will be replaced by the shared Header component.
*/

.site-header {
    padding: 34px 0 24px;
    border-bottom: 1px solid #222;
}

.brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 40px;
    line-height: 1;
    letter-spacing: .04em;
}

.brand-sub {
    margin-top: 7px;
    font-size: 10px;
    letter-spacing: .22em;
    opacity: .55;
}

/* ===== Post ===== */

.post-page {
    padding: 55px 0 80px;
}

.post-back {
    display: inline-block;
    margin-bottom: 30px;
    color: #777;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: .12em;
}

.post-back:hover {
    color: #111;
}

.post-meta {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 14px;
    color: #888;
    font-size: 11px;
    letter-spacing: .08em;
}

.post-title {
    margin: 0 0 28px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 42px;
    font-weight: 400;
    line-height: 1.2;
}

.post-cover {
    width: 100%;
    display: block;
    border-radius: 14px;
    margin-bottom: 34px;
}

.post-cover.placeholder {
    aspect-ratio: 16 / 10;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #eeeeee, #dcdcdc 48%, #f5f5f5);
    color: #777;
    font: 13px Georgia, serif;
    letter-spacing: .12em;
}

.post-summary {
    margin: 0 0 38px;
    padding-bottom: 30px;
    border-bottom: 1px solid #ddd;
    color: #666;
    font-size: 14px;
    line-height: 2;
}

.post-content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 16px;
    line-height: 2.05;
}

.post-content p {
    margin: 0 0 1.7em;
}

.post-id {
    margin-top: 55px;
    padding-top: 18px;
    border-top: 1px solid #ddd;
    color: #999;
    font-size: 10px;
    letter-spacing: .1em;
}

.post-error {
    padding: 35px 0;
    color: #777;
    line-height: 1.8;
}

/* ===== Footer placeholder ===== */

.site-footer {
    padding: 28px 0 36px;
    border-top: 1px solid #222;
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12px;
    letter-spacing: .08em;
}
</style>
</head>

<body>

<header class="site-header">
    <div class="brand">Derive Dimension Demon</div>
    <div class="brand-sub">POST / CODEX</div>
</header>

<main class="post-page" id="post">

    <a class="post-back" href="Codex.html">← CODEX</a>

    <div class="post-meta">
        <span id="post-id-meta">BLOCK</span>
        <span id="post-date">—</span>
    </div>

    <h1 class="post-title" id="post-title">載入中…</h1>

    <div id="post-cover"></div>

    <p class="post-summary" id="post-summary"></p>

    <article class="post-content" id="post-content"></article>

    <div class="post-id" id="post-id"></div>

</main>

<footer class="site-footer">
    Derive Dimension Demon
</footer>

<script>
/*
 * Post.html
 * URL example:
 * Post.html?id=260828-01
 *
 * Data source:
 * Codex/Data/260828-01.json
 *
 * Expected basic fields:
 * {
 *   "id": "260828-01",
 *   "title": "作品標題",
 *   "date": "2026-08-28",
 *   "image": "圖片檔名",
 *   "summary": "作品摘要",
 *   "content": "第一行\\n\\n第二行"
 * }
 *
 * This is deliberately tolerant of missing optional fields while
 * we are still defining the final BLOCK schema.
 */

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const titleEl = document.getElementById("post-title");
const dateEl = document.getElementById("post-date");
const idMetaEl = document.getElementById("post-id-meta");
const coverEl = document.getElementById("post-cover");
const summaryEl = document.getElementById("post-summary");
const contentEl = document.getElementById("post-content");
const postIdEl = document.getElementById("post-id");

function showError(message) {
    titleEl.textContent = "無法載入 BLOCK";
    coverEl.innerHTML = "";
    summaryEl.textContent = "";
    contentEl.innerHTML = `<div class="post-error">${message}</div>`;
}

function showPost(data) {
    document.title = `${data.title || data.id || "Post"} — Derive Dimension Demon`;

    idMetaEl.textContent = data.id || id || "BLOCK";
    dateEl.textContent = data.date || "—";
    titleEl.textContent = data.title || "未命名作品";

    if (data.image) {
        const img = document.createElement("img");
        img.className = "post-cover";
        img.src = `Codex/Data/Img/${data.image}`;
        img.alt = data.title || "";
        coverEl.replaceChildren(img);
    } else {
        const placeholder = document.createElement("div");
        placeholder.className = "post-cover placeholder";
        placeholder.textContent = "BLOCK IMAGE";
        coverEl.replaceChildren(placeholder);
    }

    summaryEl.textContent = data.summary || "";
    summaryEl.style.display = data.summary ? "" : "none";

    /*
     * textContent + white-space: pre-wrap
     * means JSON's \\n becomes a visible line break without
     * inserting HTML into the article.
     */
    contentEl.textContent = data.content || "";

    postIdEl.textContent = data.id ? `BLOCK ${data.id}` : "";
}

if (!id) {
    showError("網址沒有提供 BLOCK ID。");
} else {
    fetch(`Codex/Data/${encodeURIComponent(id)}.json`)
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return response.json();
        })
        .then(showPost)
        .catch(error => {
            console.error(error);
            showError(`找不到「${id}.json」，或 JSON 無法讀取。`);
        });
}
</script>

</body>
</html>
